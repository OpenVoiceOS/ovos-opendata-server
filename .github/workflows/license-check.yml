name: License Check
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  call_license:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # psycopg2-binary is LGPL with the psycopg linking exception, used only as a
      # database-driver library (not modified/redistributed as source). WeakCopyleft
      # is safe-as-library, so exclude this Postgres driver from the copyleft fail set.
      exclude_packages: "(?i:^psycopg2-binary([=<>!~ @;].*)?$)"
